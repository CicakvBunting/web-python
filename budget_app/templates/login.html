<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Bulanan — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2EDE3;--ink:#23201A;--ink-soft:#6B6354;--line:#D7CDB9;--accent:#9A5B34;--red:#9A3B34;--red-bg:#F0DED4;--green:#4A6B47;--green-bg:#E4EAD9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter Tight',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:22px;
  background-image:radial-gradient(var(--line) .5px,transparent .5px);background-size:22px 22px}
.box{width:100%;max-width:360px;background:#FBF8F1;border:1px solid var(--line);border-radius:14px;
  padding:30px 26px;box-shadow:0 2px 18px rgba(60,48,30,.09)}
h1{font-family:'Fraunces',serif;font-weight:900;font-size:30px;line-height:.95;letter-spacing:-.01em}
.sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:7px 0 24px}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;margin-top:13px}
label:first-of-type{margin-top:0}
input{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--line);
  background:#fff;border-radius:9px;color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;font:inherit;font-weight:600;font-size:16px;margin-top:18px;padding:12px;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:9px;cursor:pointer}
button:active{transform:translateY(1px)}
.err{background:var(--red-bg);color:var(--red);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:16px}
.notice{background:var(--green-bg);color:var(--green);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:16px}
.link{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--accent);cursor:pointer;background:none;border:none;width:100%;text-decoration:underline}
.hide{display:none}
.links{margin-top:16px;display:flex;flex-direction:column;gap:2px}
</style>
</head>
<body>
  <div class="box">
    <h1>Budget Bulanan</h1>
    <div class="sub">Plan ledger</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}

    <!-- SIGN IN -->
    <form id="loginForm" method="POST" action="/login" class="{% if show_register or show_reset %}hide{% endif %}">
      <label for="lu">Username</label>
      <input id="lu" name="username" type="text" autocomplete="username" autocapitalize="none" autofocus>
      <label for="lp">Password</label>
      <input id="lp" name="password" type="password" autocomplete="current-password">
      <button type="submit">Sign in</button>
      <div class="links">
        <button type="button" class="link" onclick="show('register')">New here? Create an account</button>
        <button type="button" class="link" onclick="show('reset')">Forgot password? Reset it</button>
      </div>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" method="POST" action="/register" class="{% if not show_register %}hide{% endif %}">
      <label for="ru">Choose a username</label>
      <input id="ru" name="username" type="text" autocomplete="username" autocapitalize="none" placeholder="3–20 letters/numbers">
      <label for="rp">Choose a password</label>
      <input id="rp" name="password" type="password" autocomplete="new-password" placeholder="At least 4 characters">
      <label for="rt">Registration token</label>
      <input id="rt" name="token" type="password" autocomplete="off" placeholder="Ask the admin for this">
      <button type="submit">Create account</button>
      <button type="button" class="link" onclick="show('login')">Back to sign in</button>
    </form>

    <!-- RESET -->
    <form id="resetForm" method="POST" action="/reset-password" class="{% if not show_reset %}hide{% endif %}">
      <label for="su">Username to reset</label>
      <input id="su" name="username" type="text" autocomplete="username" autocapitalize="none">
      <label for="phrase">Master phrase</label>
      <input id="phrase" name="phrase" type="password" autocomplete="off" placeholder="Required to authorize reset">
      <label for="np">New password</label>
      <input id="np" name="new_password" type="password" autocomplete="new-password" placeholder="At least 4 characters">
      <button type="submit">Set new password</button>
      <button type="button" class="link" onclick="show('login')">Back to sign in</button>
    </form>
  </div>
<script>
function show(which){
  document.getElementById('loginForm').classList.toggle('hide', which!=='login');
  document.getElementById('registerForm').classList.toggle('hide', which!=='register');
  document.getElementById('resetForm').classList.toggle('hide', which!=='reset');
}
</script>
</body>
</html>
